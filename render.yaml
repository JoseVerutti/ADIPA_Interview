# Blueprint de Render para el backend (https://render.com/docs/blueprint-spec).
# El frontend se despliega en Vercel (ver README).
services:
  - type: web
    name: questionnaire-extractor-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false # se ingresa en el dashboard, nunca en el repositorio
      - key: GROQ_API_KEY
        sync: false
      - key: JEV_API_KEY
        sync: false # opcional: clasificador Jev (TypeSafe AI)
      - key: CORS_ORIGINS
        sync: false # p. ej. https://<tu-app>.vercel.app
